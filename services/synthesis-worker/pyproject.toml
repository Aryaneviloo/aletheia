[project]
name = "synthesis-worker"
version = "0.1.0"
description = "Celery worker for retrieval, generation, and answer synthesis"
requires-python = ">=3.12"
dependencies = [
    "aletheia-core",
    "httpx>=0.27.0",
]

[tool.uv.sources]
aletheia-core = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"