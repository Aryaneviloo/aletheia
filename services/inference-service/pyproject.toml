[project]
name = "inference-service"
version = "0.1.0"
description = "Embedding, reranking, and LLM proxy for the Aletheia swarm"
requires-python = ">=3.12"
dependencies = [
    "aletheia-core",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sentence-transformers>=3.3.0",
    "torch>=2.5.0",
    "httpx>=0.27.0",
    "groq>=0.13.0",
]

[tool.uv.sources]
aletheia-core = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"