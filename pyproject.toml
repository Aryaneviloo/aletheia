# pyproject.toml
#
# Workspace root for the Aletheia Sovereign Engine.
# Its only jobs:
#   1. Declare workspace members so `uv lock` resolves them all against
#      one shared dependency graph (one uv.lock for the entire repo).
#   2. Hold dev-only tooling (ruff, mypy, pytest) that every service
#      should use identically, instead of redeclaring it five times.
#
# Each service/lib below has its OWN pyproject.toml with its own real
# dependencies this file only orchestrates them.

[ project ]
name = "aletheia-workspace"
version = "0.1.0"
description = "Aletheia Sovereign Engine: offline RAG orchestration"
requires-python = ">=3.12"
dependencies = []

[ tool.uv.workspace ]
members = [
    "libs/aletheia_core",
    "services/api-gateway",
    "services/inference-service",
    "services/ingestion-worker",
    "services/synthesis-worker",
    "services/judge-worker",
]

[ dependency-groups ]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "httpx>=0.27",       
]

[ tool.ruff ]
line-length = 100
target-version = "py312"

[ tool.ruff.lint ]
select = ["E", "F", "I", "UP", "B", "SIM"]   # errors, pyflakes, import-sort, pyupgrade, bugbear, simplify

[ tool.mypy ]
python_version = "3.12"
strict = true
ignore_missing_imports = true   