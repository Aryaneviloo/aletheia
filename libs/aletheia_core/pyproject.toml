[ project ]
name = "aletheia-core"
version = "0.1.0"
description = "Shared config, models, security, and infra clients for the Aletheia engine"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "psycopg[binary]>=3.2.3",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "qdrant-client>=1.12.0",
    "celery>=5.4.0",
    "redis>=5.2.0",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.0.1,<5.0.0",
    "structlog>=24.4.0",            # structured JSON logging — replaces print()
]

[ build-system ]
requires = ["hatchling"]
build-backend = "hatchling.build"
