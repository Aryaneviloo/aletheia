# services/ingestion-worker/pyproject.toml
#
# Ingestion worker — document extraction, chunking, embedding,
# and Qdrant upsert. The heaviest CPU/IO worker in the swarm.
# Calls inference-service for embeddings rather than loading
# a model directly — keeps this worker ML-free.

[project]
name = "ingestion-worker"
version = "0.1.0"
description = "Celery worker for document ingestion, chunking, and embedding"
requires-python = ">=3.12"
dependencies = [
    "aletheia-core",
    "httpx>=0.27.0",           # calls inference-service /embed
    "tiktoken>=0.8.0",         # token-aware chunking
    "beautifulsoup4>=4.12.0",  # HTML extraction
    "pypdf>=5.1.0",            # PDF extraction
]

[tool.uv.sources]
aletheia-core = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"